services:
  - type: web
    name: resrag-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: CORS_ORIGINS
        value: https://resrag-web.onrender.com
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-v2-m3
      - key: RERANK_MODE
        value: auto
      - key: RETRIEVAL_DENSE_K
        value: "32"
      - key: RETRIEVAL_SPARSE_K
        value: "32"
      - key: RETRIEVAL_FINAL_K
        value: "8"
      - key: RERANK_CANDIDATE_K
        value: "24"
      - key: MAX_OUTPUT_TOKENS
        value: "256"
      - key: FAST_FULL_TEXT_WORDS
        value: "5000"
      - key: LONG_DOCUMENT_PAGES
        value: "80"

  - type: web
    runtime: static
    name: resrag-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://resrag-api.onrender.com
